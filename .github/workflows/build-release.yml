name: build and release

# Every push to main: compile + test on Linux x86_64 and arm64, then refresh the rolling "nightly" pre-release.
# A tag v*: the same build, published as a versioned release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cmake g++ libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libgl-dev libxkbcommon-dev gnupg

      - name: Fetch pinned third-party sources
        run: scripts/fetch-deps.sh

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build build -j"$(nproc)"

      - name: Unit tests
        run: build/s3vault-tests

      - name: Package
        id: pkg
        run: |
          ver="$(git describe --tags --always)"
          name="s3vault-${ver}-linux-${{ matrix.arch }}"
          cmake --install build --prefix "stage/$name"
          cp README.md LICENSE "stage/$name/"
          tar -C stage -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: |
            ${{ steps.pkg.outputs.name }}.tar.gz
            ${{ steps.pkg.outputs.name }}.tar.gz.sha256

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ls -l dist
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            gh release create "$tag" dist/* --repo "$REPO" --title "s3vault $tag" --generate-notes --verify-tag
          else
            # Rolling pre-release that always points at the newest main.
            gh release delete nightly --repo "$REPO" --yes --cleanup-tag || true
            gh release create nightly dist/* --repo "$REPO" --prerelease --target "$GITHUB_SHA" \
              --title "Nightly (${GITHUB_SHA::7})" \
              --notes "Automatic build of \`main\` at ${GITHUB_SHA::7}. Linux x86_64 and arm64.

          Install: \`tar xzf s3vault-*-linux-<arch>.tar.gz\`, then run \`bin/s3vault\` (GUI) or \`bin/s3vault-cli\`.
          Runtime needs: libcurl4, gnupg (≥ 2.2); optional poppler-utils (PDF preview) and a Secret Service keyring."
          fi
