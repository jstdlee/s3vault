name: build and release

# Every push to main: compile + test on Linux x86_64, Linux arm64 and Windows x86_64, then refresh the rolling
# "nightly" pre-release. A tag v*: the same build, published as a versioned release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cmake g++ libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libgl-dev libxkbcommon-dev gnupg

      - name: Fetch pinned third-party sources
        run: scripts/fetch-deps.sh

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build build -j"$(nproc)"

      - name: Unit tests
        run: build/s3vault-tests

      - name: Package
        id: pkg
        run: |
          ver="$(git describe --tags --match 'v*' --always)"
          name="s3vault-${ver}-linux-${{ matrix.arch }}"
          cmake --install build --prefix "stage/$name"
          cp README.md LICENSE "stage/$name/"
          tar -C stage -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: |
            ${{ steps.pkg.outputs.name }}.tar.gz
            ${{ steps.pkg.outputs.name }}.tar.gz.sha256

  build-windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git curl python zip
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-curl mingw-w64-ucrt-x86_64-gnupg mingw-w64-ucrt-x86_64-mesa

      - name: Fetch pinned third-party sources
        run: scripts/fetch-deps.sh

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Unit tests (native gpg, Credential Manager, CreateProcess pipes)
        env:
          S3VAULT_REQUIRE_GPG: "1"
          S3VAULT_TEST_KEYCHAIN: "1"
        run: build/s3vault-tests.exe

      - name: Package
        id: pkg
        run: |
          ver="$(git describe --tags --match 'v*' --always)"
          name="s3vault-${ver}-windows-x86_64"
          cmake --install build --prefix "stage/$name"
          # libcurl and the DLLs it needs from MSYS2 (the executables themselves are statically linked).
          cp /ucrt64/bin/libcurl-4.dll "stage/$name/"
          ldd /ucrt64/bin/libcurl-4.dll | awk '$3 ~ /^\/ucrt64\// {print $3}' | sort -u | xargs -I{} cp {} "stage/$name/"
          cp README.md LICENSE "stage/$name/"
          cp platform/windows/README-windows.txt "stage/$name/README-windows.txt"
          (cd stage && zip -qr "../$name.zip" "$name")
          sha256sum "$name.zip" > "$name.zip.sha256"
          ls "stage/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "dir=stage/$name" >> "$GITHUB_OUTPUT"

      - name: Smoke test the package (CLI deps, GUI frame via Mesa)
        run: |
          dir="${{ steps.pkg.outputs.dir }}"
          home="$(cygpath -m "$PWD/smoke-home")"
          "$dir/s3vault-cli.exe" --home "$home" deps
          # The runner has no GPU driver with OpenGL 3.3: borrow Mesa's software opengl32.dll for this test only.
          mkdir -p smoke && cp -r "$dir"/* smoke/
          cp /ucrt64/bin/opengl32.dll smoke/
          ldd /ucrt64/bin/opengl32.dll | awk '$3 ~ /^\/ucrt64\// {print $3}' | sort -u | xargs -I{} cp -n {} smoke/ || true
          ls smoke
          shot="$(cygpath -m "$PWD/windows-setup.png")"
          set +e
          MSYS2_ARG_CONV_EXCL='*' GALLIUM_DRIVER=llvmpipe timeout 120 smoke/s3vault.exe --home "$home" --script "sleep:1;shot:$shot;quit" > gui.log 2>&1
          rc=$?
          set -e
          echo "s3vault.exe exit code: $rc"
          cat gui.log
          test "$rc" = 0 && test -s windows-setup.png

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-smoke-screenshot
          path: windows-setup.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: |
            ${{ steps.pkg.outputs.name }}.zip
            ${{ steps.pkg.outputs.name }}.zip.sha256

  release:
    needs: [build, build-windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7  # for the release notes; before the download, since checkout cleans the workspace

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: s3vault-*
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ls -l dist
          sed "s/@SHA@/${GITHUB_SHA::7}/" .github/release-notes.md > notes.md
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            gh release create "$tag" dist/* --repo "$REPO" --title "s3vault $tag" --notes-file notes.md --generate-notes --verify-tag
          else
            # Rolling pre-release that always points at the newest main.
            gh release delete nightly --repo "$REPO" --yes --cleanup-tag || true
            gh release create nightly dist/* --repo "$REPO" --prerelease --target "$GITHUB_SHA" \
              --title "Nightly (${GITHUB_SHA::7})" \
              --notes-file notes.md
          fi
