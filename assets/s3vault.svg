<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>s3vault</title>
  <defs>
    <!-- background: deep blue squircle with a soft top light -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a9bff"/>
      <stop offset="0.55" stop-color="#0a6cf0"/>
      <stop offset="1" stop-color="#0638a8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.08" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- brushed metal -->
    <linearGradient id="metal" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#e4eaf3"/>
      <stop offset="1" stop-color="#b5c1d3"/>
    </linearGradient>
    <linearGradient id="metalDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa8bd"/>
      <stop offset="1" stop-color="#d9e1ec"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f8fc"/>
      <stop offset="1" stop-color="#cfd8e6"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4aa6ff"/>
      <stop offset="1" stop-color="#0050d0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#001a5c" flood-opacity="0.45"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#001a5c" flood-opacity="0.35"/>
    </filter>
    <clipPath id="squircle">
      <rect x="32" y="32" width="448" height="448" rx="100"/>
    </clipPath>
  </defs>

  <!-- tile -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bg)"/>
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#glow)"/>
  <g clip-path="url(#squircle)" opacity="0.12" stroke="#ffffff" stroke-width="2" fill="none">
    <circle cx="256" cy="256" r="196"/>
    <circle cx="256" cy="256" r="226"/>
  </g>
  <rect x="33" y="33" width="446" height="446" rx="99" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>

  <!-- vault door, centred in the tile -->
  <g transform="translate(10 -42)">
  <g filter="url(#shadow)">
    <!-- hinges -->
    <rect x="96" y="236" width="70" height="30" rx="9" fill="url(#metalDark)"/>
    <rect x="96" y="330" width="70" height="30" rx="9" fill="url(#metalDark)"/>
    <circle cx="262" cy="298" r="134" fill="url(#metal)"/>
  </g>
  <circle cx="262" cy="298" r="134" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="2"/>
  <circle cx="262" cy="298" r="112" fill="url(#metalDark)"/>
  <circle cx="262" cy="298" r="104" fill="url(#face)"/>
  <!-- bolts around the rim -->
  <g fill="#8d9bb2">
    <circle cx="262" cy="176" r="6"/><circle cx="262" cy="420" r="6"/>
    <circle cx="140" cy="298" r="6"/><circle cx="384" cy="298" r="6"/>
    <circle cx="176" cy="212" r="6"/><circle cx="348" cy="212" r="6"/>
    <circle cx="176" cy="384" r="6"/><circle cx="348" cy="384" r="6"/>
  </g>
  <!-- tick marks of the dial -->
  <g stroke="#9fb0c8" stroke-width="4" stroke-linecap="round">
    <line x1="262" y1="204" x2="262" y2="216"/><line x1="262" y1="380" x2="262" y2="392"/>
    <line x1="168" y1="298" x2="180" y2="298"/><line x1="344" y1="298" x2="356" y2="298"/>
    <line x1="196" y1="232" x2="204" y2="240"/><line x1="328" y1="232" x2="320" y2="240"/>
    <line x1="196" y1="364" x2="204" y2="356"/><line x1="328" y1="364" x2="320" y2="356"/>
  </g>
  <!-- spoked handle -->
  <g stroke="#1f5fc8" stroke-width="14" stroke-linecap="round">
    <line x1="262" y1="298" x2="262" y2="232"/>
    <line x1="262" y1="298" x2="319" y2="331"/>
    <line x1="262" y1="298" x2="205" y2="331"/>
  </g>
  <g fill="#1f5fc8">
    <circle cx="262" cy="232" r="12"/><circle cx="319" cy="331" r="12"/><circle cx="205" cy="331" r="12"/>
  </g>
  <circle cx="262" cy="298" r="34" fill="url(#hub)" stroke="#ffffff" stroke-width="4"/>
  <!-- sync arrows on the hub -->
  <g fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M246 292 a17 17 0 0 1 29 -6"/>
    <path d="M271 279 l5 8 l-9 2"/>
    <path d="M278 304 a17 17 0 0 1 -29 6"/>
    <path d="M253 317 l-5 -8 l9 -2"/>
  </g>
  </g>
</svg>
